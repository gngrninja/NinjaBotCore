version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: ninjabot-test-db
    environment:
      POSTGRES_DB: ninjabot_test
      POSTGRES_USER: ninjabot_test
      POSTGRES_PASSWORD: test_password_local_only
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - ninjabot-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninjabot_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ninjabot-test-data:
    driver: local
