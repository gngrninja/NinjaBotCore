# Production environment - runs the bot and helpers in Docker
# Database: External PostgreSQL (configured via .env.production)
#
# Usage:
#   docker compose up -d --build
#
# Exposed Ports:
#   - 5100: Commands API (web dashboard integration)

services:
  ninjabot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninjabot
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5100:5100"  # Commands API for web dashboard
    environment:
      - DOTNET_ENVIRONMENT=Production
    env_file:
      - .env.production  # Production environment variables (create on server, not in git)
    volumes:
      - ./config:/app/config:ro  # Optional: config.json fallback (env vars take precedence)
      - ./logs:/app/logs
      - ./help.txt:/app/help.txt:ro

  ninjabot-helpers:
    build:
      context: ./services/NinjaBotHelpers
      dockerfile: Dockerfile
    container_name: ninjabot-helpers
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOTNET_ENVIRONMENT=Production
    env_file:
      - .env.production  # Shares credentials with main bot
    volumes:
      - ./logs/helpers:/app/logs
    depends_on:
      - ninjabot  # Ensures bot starts first (not strictly required, but logical)

volumes:
  # Legacy volume (kept for backwards compatibility)
  ninjabot-sqlite:
