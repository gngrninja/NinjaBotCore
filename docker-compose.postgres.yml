version: "3.9"

services:
  ninjabot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninjabot
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Production
      # PostgreSQL configuration
      - NINJABOT_Database__Provider=Postgres
      - NINJABOT_ConnectionStrings__NinjaBot=Host=njasrv.gngr.ninja;Port=5432;Database=ninjabot;Username=ninjabot;Password=${POSTGRES_PASSWORD};SslMode=Require
    volumes:
      - ./config:/app/config:ro
      - ./src/logs:/app/logs
    # No SQLite volume needed anymore!
